<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABC College Admission 2026</title>
  <style>
 body {
      margin: 0;
      font-family: serif;
      background: white;
    }

    header, footer {
      background: midnightblue;
      color: white;
      text-align: center;
    }

    header {
      padding: 20px;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    footer {
      padding: 10px;
      font-size: 15px;
    }

main {
      max-width: 500px;
      margin: 0 auto;
      padding: 10px 0 15px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    caption {
      padding-bottom: 2px;
    }

    th, td {
      border: 1px solid darkgray;
      padding: 5px;
      text-align: left;
    }

    th {
      background: lavender;
      text-align: center;
    }

ieldset {
      margin-top: 18px;
      padding: 5px 12px 12px;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
    }

    textarea {
      width: 95%;
    }
  </style>
</head>

<body>

  <header>
    <h1>ABC College Admission 2026</h1>
  </header>

  <main>
    <section aria-labelledby="courses-heading">
      <h2 id="courses-heading">Courses and Fees</h2>

      <table>
        <caption>Available Courses</caption>
        <thead>
          <tr>
            <th scope="col">Course</th>
            <th scope="col">Seats</th>
            <th scope="col">Fees</th>
          </tr>
        </thead>
        <tbody>

<tr>
            <td>B.Tech CSE</td>
            <td>120</td>
            <td>₹90,000</td>
          </tr>
          <tr>
            <td>BCA</td>
            <td>60</td>
            <td>₹45,000</td>
          </tr>
        </tbody>
      </table>
    </section>

    <section aria-labelledby="form-heading">
      <form action="#" method="post">
        <fieldset>
          <legend id="form-heading">Application Form</legend>

          <div class="field">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
          </div>

          <div class="field">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
          </div>
<div class="field">
            <label for="course">Course:</label>
            <select id="course" name="course" required>
              <option>B.Tech CSE</option>
              <option>BCA</option>
            </select>
          </div>

          <div class="field">
            <label for="statement">Statement:</label>
            <textarea id="statement" name="statement" rows="4" cols="45"></textarea>
          </div>

          <button type="submit">Apply</button>
        </fieldset>
      </form>
    </section>
  </main>
<footer>
    <p style="margin:0;">&copy; 2026 ABC College</p>
  </footer>

</body>
</html>
